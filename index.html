<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Cookie Clicker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e1e2f, #2d2d44); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; user-select: none; overflow: hidden; position: relative; }
        .game-container { background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); max-width: 440px; width: 90%; margin: 20px 0; z-index: 5; }
        h1 { margin-top: 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; color: #ffd700; }
        .score-display { font-size: 2.5rem; font-weight: bold; margin: 5px 0; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .cps-display { font-size: 1rem; color: #a0a0c0; margin-bottom: 10px; }
        .boost-container { background: rgba(255,215,0,0.15); border: 1px solid #ffd700; border-radius: 10px; padding: 8px 12px; margin-bottom: 15px; display: none; text-align: center; }
        .boost-title { font-weight: bold; color: #ffd700; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 4px; }
        .boost-timer { font-size: 0.9rem; color: #fff; }
        
        /* Cookie Button Base Styles */
        .cookie-btn { background: radial-gradient(circle, #d27d2d, #8b5a2b); border: 8px solid #5c3a1a; border-radius: 50%; width: 160px; height: 160px; cursor: pointer; outline: none; position: relative; box-shadow: 0 8px 0 #402812, 0 15px 20px rgba(0,0,0,0.5); margin: 15px 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transform-origin: center center; transition: box-shadow 0.05s ease; }
        .cookie-btn::before { content: ''; position: absolute; top: 25px; left: 35px; width: 16px; height: 12px; background: #3d2511; border-radius: 40%; box-shadow: 55px 15px 0 #3d2511, 15px 60px 0 #3d2511, 75px 65px 0 #3d2511, 40px 35px 0 #3d2511, -10px 45px 0 #3d2511; }
        
        /* Cookie Animation Classes */
        .cookie-click-active { animation: cookieSquish 0.12s ease-out; }
        @keyframes cookieSquish {
            0% { transform: scale(1); }
            30% { transform: scale(0.88, 1.12); }
            60% { transform: scale(1.14, 0.86); }
            100% { transform: scale(1); }
        }

        .shop-container { margin-top: 20px; text-align: left; max-height: 260px; overflow-y: auto; padding-right: 5px; }
        .shop-title { font-size: 1.2rem; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 5px; margin-bottom: 10px; color: #ff79c6; position: sticky; top: 0; background: #232337; z-index: 10; }
        .upgrade-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
        .upgrade-item.disabled { opacity: 0.4; cursor: not-allowed; background: rgba(255,255,255,0.03); }
        .upgrade-info .name { font-weight: bold; display: block; font-size: 0.95rem; }
        .upgrade-info .effect { font-size: 0.75rem; color: #aaa; }
        .upgrade-cost { font-weight: bold; color: #ffd700; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 5px; font-size: 0.9rem; }
        
        .floating-text { position: absolute; font-weight: bold; font-size: 1.6rem; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.6); z-index: 9999; }
        .golden-cookie { position: absolute; background: radial-gradient(circle, #ffe066, #b38f00); border: 4px solid #fff7d9; border-radius: 50%; width: 70px; height: 70px; cursor: pointer; box-shadow: 0 0 20px #ffd700; z-index: 999; animation: goldenPulse 1s infinite alternate; -webkit-tap-highlight-color: transparent; }
        .reset-btn { background: rgba(255,85,85,0.2); border: 1px solid rgba(255,85,85,0.4); color: #ff5555; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-size: 0.8rem; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(0.8); } }
        @keyframes goldenPulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Bakery Clicker</h1>
        <div class="score-display" id="score">0 Cookies</div>
        <div class="cps-display" id="cps">0.0 cookies per second</div>
        <div class="boost-container" id="boost-box">
            <div class="boost-title" id="boost-title">Boost Active!</div>
            <div class="boost-timer" id="boost-timer">Time Left: 0s</div>
        </div>
        <button class="cookie-btn" id="cookie-btn"></button>
        <div class="shop-container" id="shop"></div>
        <button class="reset-btn" onclick="resetGame()">Wipe Save Data</button>
    </div>
    <script>
        let score = 0, cookiesPerSecond = 0, baseClickValue = 1, productionFrenzyTimer = 0, clickFrenzyTimer = 0;
        const upgrades = {
            finger: { name: "Reinforced Finger", cost: 500, cps: 0, baseCost: 500, eff: "+5 per click" },
            clover: { name: "Golden Clover", cost: 5000, cps: 0, baseCost: 5000, eff: "Gold spawn 50% faster" },
            cursor: { name: "Auto-Clicker", cost: 15, cps: 0.1, baseCost: 15, eff: "+0.1 CPS" },
            grandma: { name: "Grandma", cost: 100, cps: 1.0, baseCost: 100, eff: "+1.0 CPS" },
            factory: { name: "Cookie Factory", cost: 1100, cps: 8.0, baseCost: 1100, eff: "+8.0 CPS" },
            mine: { name: "Cookie Mine", cost: 12000, cps: 47.0, baseCost: 12000, eff: "+47.0 CPS" },
            shipment: { name: "Space Shipment", cost: 130000, cps: 260.0, baseCost: 130000, eff: "+260.0 CPS" },
            portal: { name: "Cookie Portal", cost: 1400000, cps: 1400.0, baseCost: 1400000, eff: "+1400.0 CPS" },
            lab: { name: "Alchemy Lab", cost: 20000000, cps: 7800.0, baseCost: 20000000, eff: "+7800.0 CPS" },
            timemachine: { name: "Time Machine", cost: 330000000, cps: 44000.0, baseCost: 330000000, eff: "+44000.0 CPS" },
            galaxy: { name: "Cookie Galaxy", cost: 5100000000, cps: 260000.0, baseCost: 5100000000, eff: "+260000.0 CPS" }
        };
        for (let k in upgrades) upgrades[k].count = 0;

        const scoreEl = document.getElementById('score'), cpsEl = document.getElementById('cps'), cookieBtn = document.getElementById('cookie-btn'), boostBox = document.getElementById('boost-box'), boostTitle = document.getElementById('boost-title'), boostTimerEl = document.getElementById('boost-timer'), shopEl = document.getElementById('shop');

        function buildShopUI() {
            shopEl.innerHTML = '<div class="shop-title">Upgrades Shop</div>';
            for (let k in upgrades) {
                shopEl.innerHTML += `<div class="upgrade-item disabled" id="upgrade-${k}" onclick="buyUpgrade('${k}')"><div class="upgrade-info"><span class="name">${upgrades[k].name} (<span id="count-${k}">0</span>)</span><span class="effect">${upgrades[k].eff}</span></div><div class="upgrade-cost" id="cost-${k}">${upgrades[k].cost}</div></div>`;
            }
        }
        buildShopUI();

        function loadGame() {
            const saved = localStorage.getItem('bakeryClickerSave');
            if (saved) {
                const parsed = JSON.parse(saved); score = parsed.score || 0;
                if (parsed.upgrades) {
                    for (let k in upgrades) {
                        if (parsed.upgrades[k]) { upgrades[k].count = parsed.upgrades[k].count || 0; upgrades[k].cost = parsed.upgrades[k].cost || upgrades[k].baseCost; }
                    }
                }
            }
            calculateCPS(); updateDisplay();
        }
        function saveGame() { localStorage.setItem('bakeryClickerSave', JSON.stringify({ score, upgrades })); }
        function resetGame() { if (confirm("Wipe data?")) { localStorage.removeItem('bakeryClickerSave'); score = 0; productionFrenzyTimer = 0; clickFrenzyTimer = 0; for (let k in upgrades) { upgrades[k].count = 0; upgrades[k].cost = upgrades[k].baseCost; } calculateCPS(); updateDisplay(); } }

        function handleCookieClick(e) {
            e.preventDefault();
            let pwr = clickFrenzyTimer > 0 ? baseClickValue * 77 : baseClickValue;
            score += pwr; updateDisplay();
            
            // iPad-friendly touch coordinates calculation
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
            }
            createFloatingText(clientX, clientY, `+${pwr}`, clickFrenzyTimer > 0 ? "#ffd700" : "#00ffcc");
            
            // Trigger cookie click scale animation smoothly
            cookieBtn.classList.remove('cookie-click-active');
            void cookieBtn.offsetWidth; // Force CSS element reflow reset
            cookieBtn.add('cookie-click-active');
        }
        cookieBtn.addEventListener('touchstart', handleCookieClick, { passive: false });
        cookieBtn.addEventListener('click', handleCookieClick);
        cookieBtn.addEventListener('animationend', () => cookieBtn.classList.remove('cookie-click-active'));

        function createFloatingText(x, y, text, color) {
            const el = document.createElement('div'); el.className = 'floating-text'; el.innerText = text; el.style.color = color; el.style.left = `${x - 20}px`; el.style.top = `${y - 30}px`; document.body.appendChild(el); setTimeout(() => el.remove(), 800);
        }

        function spawnGoldenCookie() {
            if (document.querySelector('.golden-cookie')) return;
            const g = document.createElement('div'); g.className = 'golden-cookie';
            g.style.left = `${Math.random() * (window.innerWidth - 100) + 50}px`; g.style.top = `${Math.random() * (window.innerHeight - 100) + 50}px`;
            function collect(e) {
                e.preventDefault(); e.stopPropagation();
                let clientX = e.clientX, clientY = e.clientY;
                if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
                
                if (Math.random() < 0.5) { productionFrenzyTimer = 90; clickFrenzyTimer = 0; createFloatingText(clientX, clientY, "Production Frenzy x7!", '#ffd700'); }
                else { clickFrenzyTimer = 30; productionFrenzyTimer = 0; createFloatingText(clientX, clientY, "Click Frenzy x77!", '#ffd700'); }
                g.remove(); updateDisplay(); saveGame();
            }
            g.addEventListener('touchstart', collect, { passive: false }); g.addEventListener('click', collect); document.body.appendChild(g); setTimeout(() => g.remove(), 15000);
        }

        function buyUpgrade(type) {
            const item = upgrades[type];
            if (score >= item.cost) { score -= item.cost; item.count++; item.cost = Math.ceil(item.baseCost * Math.pow(1.25, item.count)); calculateCPS(); updateDisplay(); saveGame(); }
        }
        function calculateCPS() { cookiesPerSecond = 0; baseClickValue = 1 + (upgrades.finger.count * 5); for (let k in upgrades) cookiesPerSecond += upgrades[k].count * (upgrades[k].cps || 0); }

        function updateDisplay() {
            let effCPS = productionFrenzyTimer > 0 ? cookiesPerSecond * 7 : cookiesPerSecond;
            scoreEl.innerText = `${Math.floor(score)} Cookies`; cpsEl.innerText = `${effCPS.toFixed(1)} cookies per second`;
            if (productionFrenzyTimer > 0) { boostBox.style.display = "block"; boostTitle.innerText = "Production Frenzy (7x CPS)"; boostTimerEl.innerText = `Time Left: ${productionFrenzyTimer}s`; }
            else if (clickFrenzyTimer > 0) { boostBox.style.display = "block"; boostTitle.innerText = "Click Frenzy (77x Click Power)"; boostTimerEl.innerText = `Time Left: ${clickFrenzyTimer}s`; }
            else { boostBox.style.display = "none"; }
            for (let k in upgrades) {
                document.getElementById(`count-${k}`).innerText = upgrades[k].count; document.getElementById(`cost-${k}`).innerText = upgrades[k].cost;
                const box = document.getElementById(`upgrade-${k}`); if (score >= upgrades[k].cost) box.classList.remove('disabled'); else box.classList.add('disabled');
            }
        }
        setInterval(() => { score += (productionFrenzyTimer > 0 ? cookiesPerSecond * 7 : cookiesPerSecond) / 10; updateDisplay(); }, 100);
        setInterval(() => { if (productionFrenzyTimer > 0) productionFrenzyTimer--; if (clickFrenzyTimer > 0) clickFrenzyTimer--; updateDisplay(); }, 1000);
        setInterval(saveGame, 10000);
        setInterval(() => { if (Math.random() < (0.05 + (upgrades.clover.count * 0.05))) spawnGoldenCookie(); }, 30000);
        window.onload = loadGame;
    </script>
</body>
</html>
